<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<style>
  :root{
    --gold:#f5b301;
    --gold-2:#ffd45e;
    --dark:#0a0a0a;
    --card:#141414;
    --card-hover:#1d1d1d;
    --border:rgba(245,179,1,.25);
    --text:#f7f2e7;
    --muted:#9a9488;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(245,179,1,.18), transparent 60%),
      radial-gradient(900px 500px at 50% 110%, rgba(245,179,1,.08), transparent 60%),
      var(--dark);
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:48px 20px 60px;
  }
  .wrap{width:100%;max-width:480px;text-align:center}

  /* Avatar */
  .avatar-ring{
    width:132px;height:132px;margin:0 auto 18px;
    border-radius:50%;
    padding:4px;
    background:conic-gradient(from 0deg,var(--gold),var(--gold-2),#8a6100,var(--gold));
    box-shadow:0 0 32px rgba(245,179,1,.35);
    animation:spin 8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .avatar{
    width:100%;height:100%;border-radius:50%;
    background:#0d0d0d;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    animation:spin 8s linear infinite reverse;
  }
  .avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
  .avatar .crown{font-size:56px;line-height:1}

  h1{
    font-size:1.7rem;font-weight:800;letter-spacing:.5px;
    background:linear-gradient(90deg,var(--gold-2),var(--gold));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    margin-bottom:4px;
  }
  .handle{color:var(--muted);font-size:.9rem;margin-bottom:14px}
  .bio{
    color:var(--text);font-size:1rem;font-weight:500;line-height:1.5;
    max-width:340px;margin:0 auto 26px;
  }

  /* Social row */
  .socials{display:flex;justify-content:center;gap:16px;margin-bottom:30px}
  .socials a{
    width:42px;height:42px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    transition:.2s;box-shadow:0 3px 12px rgba(0,0,0,.4);
  }
  .socials a:hover{transform:translateY(-3px) scale(1.06)}
  .socials svg{width:42px;height:42px;display:block}

  /* Link buttons */
  .links{display:flex;flex-direction:column;gap:14px}
  .link{
    display:flex;align-items:center;gap:14px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:15px 18px;
    color:var(--text);text-decoration:none;
    font-weight:600;font-size:1rem;
    transition:.2s;
    position:relative;overflow:hidden;
  }
  .link::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,rgba(245,179,1,.12),transparent);
    transform:translateX(-100%);transition:.5s;
  }
  .link:hover{background:var(--card-hover);border-color:var(--gold);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.5)}
  .link:hover::before{transform:translateX(100%)}
  .link .ic{
    width:40px;height:40px;flex:0 0 40px;border-radius:11px;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    background:transparent;color:var(--gold);
  }
  .link .ic svg{width:40px;height:40px;display:block}
  .link .label{flex:1;text-align:center;padding-right:40px}
  .link .arrow{opacity:.4;font-size:1.1rem}

  /* Botão de destaque (Grupo Free) */
  .link.free{
    background:linear-gradient(135deg,#1faf52,#0f8a3d);
    border-color:#2ecc71;
    color:#fff;
    box-shadow:0 6px 22px rgba(31,175,82,.35);
    animation:pulse 2s ease-in-out infinite;
  }
  .link.free .ic{background:rgba(255,255,255,.18);color:#fff}
  .link.free:hover{background:linear-gradient(135deg,#25c95f,#12a047);border-color:#2ecc71}
  @keyframes pulse{
    0%,100%{box-shadow:0 6px 22px rgba(31,175,82,.35)}
    50%{box-shadow:0 6px 30px rgba(46,204,113,.6)}
  }

  .footer{margin-top:34px;color:var(--muted);font-size:.78rem;letter-spacing:.5px}
  .footer .crown{color:var(--gold)}
</style>

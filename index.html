<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KING METODOS</title>
<meta name="description" content="Apenas um cara que coloca dinheiro no seu bolso!">
<meta property="og:title" content="KING METODOS">
<meta property="og:description" content="Apenas um cara que coloca dinheiro no seu bolso! 🤵">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
<style>
  :root{
    --gold:#f5b301;
    --gold-2:#ffd45e;
    --dark:#0a0a0a;
    --card:#141414;
    --card-hover:#1d1d1d;
    --border:rgba(245,179,1,.25);
    --text:#f7f2e7;
    --muted:#9a9488;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(245,179,1,.18), transparent 60%),
      radial-gradient(900px 500px at 50% 110%, rgba(245,179,1,.08), transparent 60%),
      var(--dark);
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:48px 20px 60px;
  }
  .wrap{width:100%;max-width:480px;text-align:center}

  /* Avatar */
  .avatar-ring{
    width:132px;height:132px;margin:0 auto 18px;
    border-radius:50%;
    padding:4px;
    background:conic-gradient(from 0deg,var(--gold),var(--gold-2),#8a6100,var(--gold));
    box-shadow:0 0 32px rgba(245,179,1,.35);
    animation:spin 8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .avatar{
    width:100%;height:100%;border-radius:50%;
    background:#0d0d0d;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    animation:spin 8s linear infinite reverse;
  }
  .avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
  .avatar .crown{font-size:56px;line-height:1}

  h1{
    font-size:1.7rem;font-weight:800;letter-spacing:.5px;
    background:linear-gradient(90deg,var(--gold-2),var(--gold));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    margin-bottom:4px;
  }
  .handle{color:var(--text);font-size:1.25rem;font-weight:600;margin:2px 0 16px}
  .bio{
    color:var(--text);font-size:1rem;font-weight:500;line-height:1.5;
    max-width:340px;margin:0 auto 26px;
  }

  /* Social row */
  .socials{display:flex;justify-content:center;gap:16px;margin-bottom:30px}
  .socials a{
    width:42px;height:42px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    transition:.2s;box-shadow:0 3px 12px rgba(0,0,0,.4);
  }
  .socials a:hover{transform:translateY(-3px) scale(1.06)}
  .socials svg{width:42px;height:42px;display:block}

  /* Link buttons */
  .links{display:flex;flex-direction:column;gap:14px}
  .link{
    display:flex;align-items:center;gap:14px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:15px 18px;
    color:var(--text);text-decoration:none;
    font-weight:600;font-size:1rem;
    transition:.2s;
    position:relative;overflow:hidden;
  }
  .link::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,rgba(245,179,1,.12),transparent);
    transform:translateX(-100%);transition:.5s;
  }
  .link:hover{background:var(--card-hover);border-color:var(--gold);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.5)}
  .link:hover::before{transform:translateX(100%)}
  .link .ic{
    width:46px;height:46px;flex:0 0 46px;border-radius:11px;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    background:transparent;color:var(--gold);
  }
  .link .ic svg{width:46px;height:46px;display:block}
  .link .ic img{width:100%;height:100%;object-fit:cover;display:block}
  .link .txt{flex:1;text-align:center;padding-right:46px;min-width:0}
  .link .title{display:block;font-weight:600;font-size:1rem;line-height:1.25}
  .link .desc{display:block;font-weight:400;font-size:.76rem;color:var(--muted);margin-top:3px;line-height:1.2}
  .link.free .desc{color:rgba(255,255,255,.85)}
  .link .arrow{opacity:.4;font-size:1.1rem;flex:0 0 auto}

  /* Botão de destaque (Grupo Free) */
  .link.free{
    background:linear-gradient(135deg,#1faf52,#0f8a3d);
    border-color:#2ecc71;
    color:#fff;
    box-shadow:0 6px 22px rgba(31,175,82,.35);
    animation:pulse 2s ease-in-out infinite;
  }
  .link.free .ic{background:rgba(255,255,255,.18);color:#fff}
  .link.free:hover{background:linear-gradient(135deg,#25c95f,#12a047);border-color:#2ecc71}
  @keyframes pulse{
    0%,100%{box-shadow:0 6px 22px rgba(31,175,82,.35)}
    50%{box-shadow:0 6px 30px rgba(46,204,113,.6)}
  }

  .footer{margin-top:34px;color:var(--muted);font-size:.78rem;letter-spacing:.5px}
  .footer .crown{color:var(--gold)}
</style>
</head>

  <div class="wrap">

    <div class="avatar-ring">
      <div class="avatar">
        <!-- Logo: tenta varios nomes/extensoes; se nao achar nenhum, mostra a coroa -->
        <img src="logo.png.jpg" alt="KING METODOS" data-alt="logo.png,logo.jpg,logo.jpeg,logo.webp"
             onerror="var l=(this.dataset.alt||'').split(',').filter(Boolean);if(l.length){this.dataset.alt=l.slice(1).join(',');this.src=l[0];}else{this.style.display='none';this.parentNode.querySelector('.crown').style.display='block';}">
        <span class="crown" style="display:none">👑</span>
      </div>
    </div>

    <div class="handle">@kingmetodos.br</div>

    <!-- Ícones sociais -->
    <div class="socials">
      <a href="https://instagram.com/kingmetodos.br" target="_blank" rel="noopener" aria-label="Instagram">
        <svg><use href="#ic-ig"/></svg>
      </a>
      <a href="https://www.tiktok.com/@thekingmetodos1" target="_blank" rel="noopener" aria-label="TikTok">
        <svg><use href="#ic-tt"/></svg>
      </a>
      <a href="https://wa.me/5511924897240" target="_blank" rel="noopener" aria-label="WhatsApp">
        <svg><use href="#ic-wa"/></svg>
      </a>
      <a href="https://youtube.com/@kingmetodosbr" target="_blank" rel="noopener" aria-label="YouTube">
        <svg><use href="#ic-yt"/></svg>
      </a>
    </div>

    <!-- Botões principais (gerados a partir da lista BOTOES lá embaixo) -->
    <div class="links" id="links"></div>

  <!-- ============================================================= -->
  <!--  EDITAR OS BOTÕES AQUI                                        -->
  <!--  Cada botão tem 4 campos:                                     -->
  <!--    logo    = imagem do botão. Use: ig / tt / wa / yt          -->
  <!--              (logos das redes) OU o nome de uma imagem sua    -->
  <!--              (ex: "logo.png.jpg") que esteja no repositório.  -->
  <!--    titulo  = nome que aparece no botão                        -->
  <!--    desc    = descrição pequena embaixo (deixe "" pra ocultar) -->
  <!--    url     = link que o botão abre                            -->
  <!--    free:true (opcional) = deixa o botão verde em destaque     -->
  <!-- ============================================================= -->
  <script>
    const BOTOES = [
      {
        logo: "wa",
        titulo: "🎁 Entrar no Grupo Free",
        desc: "Comunidade no WhatsApp • Cadastro gratuito",
        url: "https://chat.whatsapp.com/Fxk8VtVOrIMFT2xojf5Txt?s=cl&p=i&ilr=4&amv=0",
        free: true
      },
      {
        logo: "ig",
        titulo: "Meu Instagram",
        desc: "",
        url: "https://instagram.com/kingmetodos.br"
      },
      {
        logo: "wa",
        titulo: "WhatsApp",
        desc: "Tire sua dúvida comigo",
        url: "https://wa.me/5511924897240"
      },
      {
        logo: "tt",
        titulo: "TikTok",
        desc: "",
        url: "https://www.tiktok.com/@thekingmetodos1"
      },
      {
        logo: "yt",
        titulo: "YouTube",
        desc: "",
        url: "https://youtube.com/@kingmetodosbr"
      }
    ];

    (function () {
      var logosConhecidas = { ig: "ic-ig", tt: "ic-tt", wa: "ic-wa", yt: "ic-yt" };
      function iconeHTML(b) {
        if (b.free) return '<svg><use href="#ic-wa-mono"/></svg>';
        if (logosConhecidas[b.logo]) return '<svg><use href="#' + logosConhecidas[b.logo] + '"/></svg>';
        return '<img src="' + b.logo + '" alt="">';
      }
      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
        });
      }
      var html = BOTOES.map(function (b) {
        var desc = b.desc ? '<span class="desc">' + esc(b.desc) + "</span>" : "";
        return '<a class="link' + (b.free ? " free" : "") + '" href="' + esc(b.url) + '" target="_blank" rel="noopener">' +
          '<span class="ic">' + iconeHTML(b) + "</span>" +
          '<span class="txt"><span class="title">' + esc(b.titulo) + "</span>" + desc + "</span>" +
          '<span class="arrow">›</span>' +
          "</a>";
      }).join("");
      document.getElementById("links").innerHTML = html;
    })();
  </script>
